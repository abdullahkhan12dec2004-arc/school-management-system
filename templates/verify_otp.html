{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:420px; margin-top:60px;">
  <h3>Email Verification</h3>
  <p>OTP <strong>{{ email }}</strong> par bheja gaya hai. Neeche daalein.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label>6-digit OTP</label>
      <input type="text" name="otp" maxlength="6" pattern="\d{6}" class="form-control" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Verify</button>
  </form>

  <div class="text-center mt-3">
    <a href="{{ url_for('resend_otp') }}">OTP dobara bhejein</a>
  </div>
</div>
{% endblock %}
